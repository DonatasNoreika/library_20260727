{% extends 'base.html' %}

{% block content %}

<p><b>Vardas: </b>{{ author.first_name }}</p>
<p><b>Pavardė: </b>{{ author.last_name }}</p>
<p>{{ author.description }}</p>
<hr>
<h2>Autoriaus knygos:</h2>
{% for book in author.books.all %}
<p><a href="{% url 'book' book.pk %}">{{ book }}</a></p>
{% endfor %}
{% endblock %}
